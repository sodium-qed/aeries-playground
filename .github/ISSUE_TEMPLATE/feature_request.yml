name: Suggestion
description: Share an idea or something that could be easier. A sentence or two is enough.
title: "[Suggestion] "
body:
  - type: markdown
    attributes:
      value: |
        Describe the idea in your title, then answer the first question. No technical solution or coding knowledge is needed. Spell out abbreviations so others can understand the request.

        This issue is public. Use invented examples, without real grades, names, account details, copied Aeries pages, or saved-settings exports. For a possible vulnerability or data leak, follow [SECURITY.md](https://github.com/sodium-qed/aeries-playground/blob/main/SECURITY.md#report-a-vulnerability-privately) before sharing details.
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: Describe the improvement and when it would help. It is fine to explain a need without knowing the solution.
      placeholder: I would like to... This would help when...
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Example or extra detail (optional)
      description: Add an invented example, a sketch without account data, or what you would expect to see. You can leave this blank.
      placeholder: On this page... I would expect... For example, in a fictional course...
  - type: markdown
    attributes:
      value: |
        One idea per issue helps discussion. You can [browse existing ideas](https://github.com/sodium-qed/aeries-playground/issues), but research is not required to submit a suggestion.

        [Feature guide](https://github.com/sodium-qed/aeries-playground/blob/main/docs/FEATURES.md) · [Contribution guide](https://github.com/sodium-qed/aeries-playground/blob/main/CONTRIBUTING.md)
