name: Bug report
description: Tell us what went wrong. You do not need to know the cause or repeat the problem.
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        Give the issue a short, descriptive title. Only the first question is required; answer the others when you can. “I don't know” is fine.

        This issue is public. Use generic courses and invented scores. Do not share real grades, names, account identifiers, passwords, cookies, logged-in URLs, copied Aeries pages, network captures, or saved-settings exports. Screenshots are optional and must have private information removed. For a possible vulnerability or data leak, follow [SECURITY.md](https://github.com/sodium-qed/aeries-playground/blob/main/SECURITY.md#report-a-vulnerability-privately) before posting details here.
  - type: textarea
    id: actual
    attributes:
      label: What happened?
      description: Name the page or control, describe what you saw, and say what you expected if you know. Type an error message only if it contains no private data.
      placeholder: When I..., Playground showed... / I expected to be able to...
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How did you reach the problem? (optional)
      description: List the page and clicks you remember. If it happened once or you cannot repeat it, say so. Do not paste a logged-in URL.
      placeholder: |
        1. Opened the dashboard / a fictional course's gradebook...
        2. Selected...
        3. Noticed...
  - type: input
    id: environment
    attributes:
      label: Browser and userscript manager (optional)
      description: Names are enough; add version numbers only if known.
      placeholder: Chrome with Tampermonkey / Firefox / I don't know
  - type: input
    id: script-version
    attributes:
      label: Script version and installation (optional)
      description: If known, read @version near the top of Aeries Playground in the manager's editor. Include a release tag or source commit if you know it, and say whether this was a fresh install or manual replacement.
      placeholder: Version...; release or main link...; fresh install or replacement... / I don't know
  - type: textarea
    id: example
    attributes:
      label: Invented example or relevant settings (optional)
      description: Fictional scores and grading rules help with calculations. Distinguish zero, blank, and excluded work. For other problems, describe the setting or control. Do not attach page source or a settings export.
      placeholder: |
        Fictional Course A uses total points: Practice A is 8/10, Quiz B is 0/10, and Project C is blank/20.
        I expected 40% from the two graded assignments. Playground displayed...
        The relevant setting was...
  - type: markdown
    attributes:
      value: |
        You do not need developer tools, account access, or a settings reset to report a problem. If you already compared with the script disabled and reloaded, mention the result above.

        [Troubleshooting](https://github.com/sodium-qed/aeries-playground/blob/main/docs/FEATURES.md#troubleshooting) · [Optional details for specific features](https://github.com/sodium-qed/aeries-playground/blob/main/CONTRIBUTING.md#extra-details-that-may-help)
