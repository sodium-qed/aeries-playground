name: Bug report
description: Tell us what went wrong. Plain language and invented examples are enough.
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        Describe what you noticed; you do not need to know the cause. Technical details below are optional, and “I don't know” is fine. Give the issue a short, descriptive title.

        This issue will be public. Use generic courses and invented scores. Do not share real grades, names, account identifiers, passwords, cookies, logged-in URLs, Aeries page exports, or saved-settings exports. Screenshots are optional and must have private information removed. For a possible security or privacy problem, follow [SECURITY.md](https://github.com/sodium-qed/aeries-playground/blob/main/SECURITY.md) before posting details here.
  - type: textarea
    id: actual
    attributes:
      label: What happened?
      description: Describe the incorrect display, missing control, or error. Type a short error message only if it contains no private data.
      placeholder: When I..., Playground showed... / The control did not...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
      description: Describe what you expected to see or be able to do. You do not need to know the correct formula.
      placeholder: I expected...
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: What led to the problem?
      description: List the page and clicks you remember. If it happened only once or you cannot repeat it, say so. Do not paste a logged-in URL.
      placeholder: |
        1. Opened the dashboard / an invented course's gradebook...
        2. Selected...
        3. Noticed...
    validations:
      required: true
  - type: dropdown
    id: page
    attributes:
      label: Where did this happen? (optional)
      options:
        - Dashboard or course appearance
        - Grade testing or calculations
        - GPA or 4/3/2/1 summary
        - Assignment weight map
        - Next-class widget
        - KBAR music
        - Settings
        - Installation or updates
        - Instructions or documentation
        - Somewhere else / I am not sure
  - type: input
    id: environment
    attributes:
      label: Browser and userscript manager (optional)
      description: Names are enough; add version numbers only if known.
      placeholder: Chrome with Tampermonkey / Firefox / I don't know
  - type: input
    id: script-version
    attributes:
      label: Script version and installation (optional)
      description: If known, read @version near the top of Aeries Playground in your manager's editor. Say whether you used a release or the README install link, and whether this was a fresh install or manual update.
      placeholder: Version...; release tag or main link...; fresh install or update... / I don't know
  - type: textarea
    id: example
    attributes:
      label: Small invented example or relevant settings (optional)
      description: For calculations, fictional scores and grading rules help; distinguish zero, blank, and excluded work. Otherwise describe the relevant control or setting. Do not attach page source, logs with account data, or a settings export.
      placeholder: |
        Fictional Course A uses total points. Practice A is 8/10, Quiz B is 0/10, and Project C is blank/20.
        I expected 40% from the two graded assignments. The value I actually saw was...
        The relevant setting was...
  - type: markdown
    attributes:
      value: |
        You do not need to clear saved settings or share account access to report a problem. If you already compared with the script disabled and reloaded, you can mention the result above.

        [Troubleshooting](https://github.com/sodium-qed/aeries-playground/blob/main/docs/FEATURES.md#troubleshooting) · [Optional details for specific features](https://github.com/sodium-qed/aeries-playground/blob/main/CONTRIBUTING.md#use-a-small-invented-example)
