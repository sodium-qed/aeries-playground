name: Publish Grade Lab percentage prerelease 3.1.3

on:
  push:
    branches: [ci/publish-grade-lab-percentage-3.1.3]
    paths:
      - .github/release-requests/v3.1.3.txt

permissions:
  contents: read

concurrency:
  group: aeries-playground-3-1-release
  cancel-in-progress: false

jobs:
  prerelease:
    if: github.repository == 'sodium-qed/aeries-playground' && github.ref == 'refs/heads/ci/publish-grade-lab-percentage-3.1.3'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      RELEASE_TAG: v3.1.3
      FROZEN_SOURCE_COMMIT: fc27ee6ff46eaec575cceb66d3c445807173faeb
      RELEASE_HASH: 502b7b0e6616394a7b9d1d53cbeb43c45075ce7647976790969239cb8e8173f3
      RELEASE_BYTES: '392930'
    steps:
      - name: Check out the release request
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Read release candidate after the scheduled time
        id: request
        shell: bash
        run: |
          set -euo pipefail
          if (( $(date -u +%s) < $(date -u -d '2026-11-30T07:59:00Z' +%s) )); then
            echo 'The scheduled prerelease time has not arrived.' >&2
            exit 1
          fi
          candidate=$(cat .github/release-requests/v3.1.3.txt)
          [[ "$candidate" =~ ^[0-9a-f]{40}$ ]]
          echo "commit=$candidate" >> "$GITHUB_OUTPUT"
      - name: Check out the exact documented release candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ steps.request.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify the frozen source and release documentation
        run: |
          git merge-base --is-ancestor "$FROZEN_SOURCE_COMMIT" HEAD
          git diff --exit-code "$FROZEN_SOURCE_COMMIT" HEAD -- . ':(exclude)docs/**' ':(exclude)README.md'
          test -s docs/RELEASE-3.1.3.md
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Run repository checks
        run: |
          node --test tests/*.test.mjs
          node scripts/check-userscripts.mjs
          node scripts/check-documentation.mjs
      - name: Publish the verified userscript as a prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ steps.request.outputs.commit }}
        run: |
          set -euo pipefail
          asset=aeries-playground.user.js
          notes=docs/RELEASE-3.1.3.md
          title='Aeries Playground 3.1.3 prerelease'

          repo_api() { gh api "repos/$GITHUB_REPOSITORY/$1" "${@:2}"; }

          release_by_tag() {
            repo_api 'releases?per_page=100' --paginate --slurp | jq -c --arg tag "$RELEASE_TAG" '
              [.[][] | select(.tag_name == $tag)] | if length > 1 then error("Duplicate release tag") else .[] end
            '
          }

          stable_latest_id() {
            repo_api releases/latest --jq 'select(.draft == false and .prerelease == false) | .id'
          }

          check_stable_latest() {
            test "$(stable_latest_id)" = "$stable_id"
          }

          tag_target() {
            repo_api "git/matching-refs/tags/$RELEASE_TAG" --jq '.[] | select(.ref == "refs/tags/v3.1.3") | .object.type + ":" + .object.sha'
          }

          checked_release_id() {
            jq -er --arg title "$title" --arg commit "$RELEASE_COMMIT" --rawfile notes "$notes" '
              select(.name == $title and .prerelease == true and
                ((.body | rtrimstr("\n")) == ($notes | rtrimstr("\n"))) and
                (.draft == false or (.draft == true and .target_commitish == $commit))) | .id
            ' <<< "$1"
          }

          verify_asset() {
            jq -e --arg name "$asset" --arg digest "sha256:$RELEASE_HASH" --argjson size "$RELEASE_BYTES" '
              .assets | length == 1 and .[0].name == $name and .[0].state == "uploaded" and
              .[0].size == $size and (.[0].digest == null or .[0].digest == $digest)
            ' <<< "$1" > /dev/null
            local download_dir
            download_dir=$(mktemp -d)
            gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$asset" --dir "$download_dir"
            cmp -- "$asset" "$download_dir/$asset"
          }

          test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"
          test "$(wc -c < "$asset")" -eq "$RELEASE_BYTES"
          sha256sum --check --status <<< "$RELEASE_HASH  $asset"
          stable_id=$(stable_latest_id)
          test -n "$stable_id"

          state=$(release_by_tag)
          if [[ -n "$state" ]]; then
            release_id=$(checked_release_id "$state")
          fi

          target=$(tag_target)
          if [[ -z "$target" ]]; then
            if [[ -n "$state" ]]; then
              test "$(jq -r .draft <<< "$state")" = true
            fi
            repo_api git/refs --method POST -f ref="refs/tags/$RELEASE_TAG" -f sha="$RELEASE_COMMIT" > /dev/null
          fi
          test "$(tag_target)" = "commit:$RELEASE_COMMIT"

          if [[ -z "$state" ]]; then
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --target "$RELEASE_COMMIT" --verify-tag \
              --draft --prerelease --latest=false --title "$title" --notes-file "$notes"
            state=$(release_by_tag)
            test -n "$state"
            release_id=$(checked_release_id "$state")
          fi

          if [[ "$(jq -r '.assets | length' <<< "$state")" == 0 ]]; then
            test "$(jq -r .draft <<< "$state")" = true
            gh release upload "$RELEASE_TAG" "$asset" --repo "$GITHUB_REPOSITORY"
            state=$(repo_api "releases/$release_id")
          fi
          verify_asset "$state"

          if [[ "$(jq -r .draft <<< "$state")" == true ]]; then
            check_stable_latest
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease --latest=false
          fi

          published=$(repo_api "releases/tags/$RELEASE_TAG")
          test "$(checked_release_id "$published")" = "$release_id"
          test "$(jq -r .draft <<< "$published")" = false
          test "$(tag_target)" = "commit:$RELEASE_COMMIT"
          verify_asset "$published"
          check_stable_latest
          jq -r .html_url <<< "$published"
