name: Merge prepared 3.1.0 integration at the scheduled deadline

on:
  schedule:
    # 2026-11-02 07:59 UTC = Sunday 2026-11-01 23:59 PST.
    # Python bounds the annual cron to the intended 2026 launch window.
    - cron: '59 7 2 11 *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aeries-playground-3-1-release
  cancel-in-progress: false

jobs:
  scheduled-merge:
    if: github.repository == 'sodium-qed/aeries-playground' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
      pull-requests: write
      issues: write
      checks: read
      statuses: read
      actions: read
    steps:
      - name: Check out the scheduling revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Validate and merge the approved PR, then publish its exact commit as a prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/merge-prepared-release.py
