name: Recover fixed 2.4 prerelease

on:
  push:
    branches: [main]
    paths:
      - 'aeries-playground.user.js'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aeries-playground-2-4-release
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'sodium-qed/aeries-playground' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out the triggering commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Validate or recover the prepared 2.4 prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          from datetime import datetime, timezone
          from pathlib import Path
          from urllib.parse import quote
          import base64
          import hashlib
          import json
          import os
          import re
          import subprocess
          import tempfile

          source = Path('aeries-playground.user.js')
          # Sunday, October 18, 2026 at 11:59 PM America/Los_Angeles (PDT).
          launch_time = datetime(2026, 10, 19, 6, 59, tzinfo=timezone.utc)
          # User-authorized merge of the weight-map preview and current KBAR fallback.
          expected_hash = '9c3c031018cb8de56cbf7ea5b540dd0ba559ae887b7aaac5989046510233a4ac'
          expected_size = 326943
          # This publisher belongs only to the frozen 2.4 artifact. Later pushes,
          # including documentation/license comments in the userscript, must not
          # create releases or republish assets. Manual recovery remains strict.
          prepared_source = (source.is_file()
              and source.stat().st_size == expected_size
              and hashlib.sha256(source.read_bytes()).hexdigest() == expected_hash)
          if os.environ.get('GITHUB_EVENT_NAME') == 'push' and not prepared_source:
              print('Push differs from the frozen 2.4 artifact; no release or asset changes attempted.')
              raise SystemExit(0)
          if datetime.now(timezone.utc) < launch_time:
              print('The release time has not arrived; no release was created.')
              raise SystemExit(0)
          if not source.is_file():
              raise SystemExit('The prepared userscript is missing.')
          if not prepared_source:
              raise SystemExit('The userscript does not match the prepared launch file.')
          if not re.search(r'^//\s*@version\s+2\.4\.0\s*$', source.read_text(), re.MULTILINE):
              raise SystemExit('The userscript metadata does not match version 2.4.0.')

          # These checks compile the source; they do not run it against Aeries.
          subprocess.run(['node', 'scripts/check-userscripts.mjs'], check=True)
          subprocess.run(['node', '--test', 'tests/check-userscripts.test.mjs'], check=True)
          repo = os.environ['GITHUB_REPOSITORY']
          commit = os.environ['GITHUB_SHA']
          tag = 'v2.4.0'
          title = 'Aeries Playground 2.4.0'

          def gh(*args, check=True):
              return subprocess.run(['gh', *args], check=check, text=True, capture_output=True)

          def api(path, absent_ok=False):
              result = gh('api', path, check=False)
              if result.returncode:
                  # Authentication, rate-limit, and service failures must not be
                  # mistaken for an absent release or tag.
                  if absent_ok and '(HTTP 404)' in result.stderr:
                      return None
                  raise SystemExit(result.stderr.strip() or 'GitHub API request failed.')
              return json.loads(result.stdout)

          def api_write(path, method, payload):
              result = subprocess.run(
                  ['gh', 'api', path, '--method', method, '--input', '-'],
                  input=json.dumps(payload), text=True, capture_output=True)
              if result.returncode:
                  raise SystemExit(result.stderr.strip() or 'GitHub API write failed.')
              return json.loads(result.stdout)

          def verify_source_at(ref):
              file = api(f'repos/{repo}/contents/{source.name}?ref={quote(ref, safe="")}')
              if file.get('type') != 'file' or file.get('encoding') != 'base64':
                  raise SystemExit('The tagged source is not an ordinary readable file.')
              contents = base64.b64decode(file['content'])
              if len(contents) != expected_size or hashlib.sha256(contents).hexdigest() != expected_hash:
                  raise SystemExit('The referenced commit contains a different userscript.')

          def tagged_commit(ref):
              # Peel annotated tags explicitly; a branch with the same name
              # must never be mistaken for the release tag.
              obj = ref['object']
              for _ in range(8):
                  if obj['type'] == 'commit':
                      return obj['sha']
                  if obj['type'] != 'tag':
                      break
                  obj = api(f'repos/{repo}/git/tags/{obj["sha"]}')['object']
              raise SystemExit('The release tag does not resolve to a commit.')

          # Snapshot Latest before writes and preserve it through publication.
          # A prior partial run may have made this prerelease Latest; only that
          # specific case (or a missing Latest) permits restoring the stable tag.
          stable = api(f'repos/{repo}/releases/tags/v2.0.0')
          if stable['draft'] or stable['prerelease']:
              raise SystemExit('The stable release has unexpected metadata.')
          latest_before = api(f'repos/{repo}/releases/latest', absent_ok=True)
          if latest_before and latest_before['id'] != stable['id'] and latest_before['tag_name'] != tag:
              raise SystemExit('Latest has changed to another stable release; nothing was published.')

          # Check the repository blob too, so checkout line-ending conversion
          # cannot conceal a difference between the tag and uploaded asset.
          verify_source_at(commit)
          tag_path = f'repos/{repo}/git/ref/tags/{tag}'
          tag_ref = api(tag_path, absent_ok=True)
          release_commit = tagged_commit(tag_ref) if tag_ref else commit
          verify_source_at(release_commit)
          release_path = f'repos/{repo}/releases/tags/{tag}'

          def release_for_tag():
              release = api(release_path, absent_ok=True)
              if release:
                  return release
              # GitHub's release-by-tag endpoint intentionally omits drafts.
              # Search the authenticated release list so a partially completed
              # run can validate and finish its existing draft safely.
              matches = [item for item in api(f'repos/{repo}/releases?per_page=100')
                         if item.get('tag_name') == tag]
              if len(matches) > 1:
                  raise SystemExit('Multiple releases use the expected tag.')
              return matches[0] if matches else None

          release = release_for_tag()
          if release and release['tag_name'] != tag:
              raise SystemExit('The existing release uses an unexpected tag.')
          if release and release['draft']:
              # Never repurpose a draft whose intended source differs. A
              # documentation-only commit with identical source is acceptable.
              verify_source_at(release['target_commitish'])
          if release and not release['draft'] and not tag_ref:
              raise SystemExit('The published release is missing its tag.')
          # An identical release published as stable may be corrected below,
          # but only after both its tagged source and attached asset verify.

          with tempfile.TemporaryDirectory() as folder:
              notes = Path(folder) / 'release-notes.md'
              notes.write_text(
                  'Aeries Playground 2.4.0 is a publicly downloadable prerelease adding '
                  'a saved Show ungraded assignments checkbox directly inside Weight map. '
                  'It defaults off. Turn it on to preview relative shares using known '
                  'positive possible points and category weights. Ungraded work uses '
                  'neutral gray circles; explicitly excluded work stays excluded. Unknown '
                  'weights remain in the list without circles. Blank scores never become '
                  'zeros, and actual grades, impacts, and GPA stay unchanged. Empty courses '
                  'can show a preview when the visible Aeries totals reconcile. Turn the '
                  'checkbox off for the graded-only view. The choice saves globally across '
                  'courses and profiles/years, without saving scores or preview results.\n\n'
                  'This merged release retains fractional-score precision, the '
                  'next-school-day countdown, and the current KBAR playback fixes.\n\n'
                  'When validated data already embedded in the open Aeries page matches the '
                  'visible student, course, assignment, dates, and rounded score, grade '
                  'reconstruction and hypothetical testing preserve values such as '
                  '`14.66666666666667 / 15` instead of using the desktop-rounded `14.67 / 15`. '
                  'Matching identifiers stay in memory: the adapter does not save identity '
                  'data or fetch additional or hidden records. Missing, ambiguous, excluded, '
                  'inconsistent, or four-point records retain the visible-data behavior.\n\n'
                  'The opt-in MVHS schedule countdown can continue after school and across '
                  'weekends or no-school days, searching up to 14 days ahead. Pacific '
                  'daylight-saving changes are accounted for; minutes-only fallback remains '
                  'when the future date or clock cannot be verified.\n\n'
                  'KBAR retains its hidden player and pause handling. Press P outside a text '
                  'field or the Playground dialog, or use the Settings playback button, to '
                  'play or pause. Close the player to stop and unload it. Playback starts '
                  'off on every page load. The visible Settings → Open on YouTube fallback '
                  'is preserved and remains available when the embed is blocked or closed.\n\n'
                  'Starting KBAR connects to a YouTube privacy-enhanced embed. '
                  'YouTube can receive connection and playback information and may '
                  'show ads; privacy-enhanced embedding is not anonymous. Playground '
                  'does not include grades, assignments, or course names in its '
                  'player URL or playback commands.\n\n'
                  'Weighted and unweighted current-year GPA estimates remain available. '
                  'Select eligible honors/AP courses manually; '
                  'A/B/C receive one bonus point and D/F remain 1/0. These are local '
                  'estimates, not official transcript GPAs.\n\n'
                  'Install or manually update with the attached '
                  '`aeries-playground.user.js`. Read the privacy, permission, and '
                  'license comments at the top first. Fresh Tampermonkey installs '
                  'disable automatic updates through `@downloadURL none`; existing '
                  'installs and other managers may retain different update settings.\n\n'
                  'The raw-main installation link now serves this prerelease; use a '
                  'version-tagged release download when choosing a fixed version. '
                  'The stable Latest release remains unchanged.\n\n'
                  'The workflow checks JavaScript syntax, userscript metadata, and the '
                  'repository checker tests before publication. These checks do not run '
                  'features in a live Aeries browser session. Browser integration has not '
                  'been tested for this combined prerelease.\n\n'
                  f'Verified merged userscript: {expected_size} bytes; SHA-256 `{expected_hash}`.\n\n'
                  '[Installation and feature guide](https://github.com/sodium-qed/aeries-playground#install)\n',
                  encoding='utf-8')

              def verify_asset():
                  # The asset is downloaded and hashed before any draft is
                  # published. Never use --clobber on an existing asset.
                  with tempfile.TemporaryDirectory(dir=folder) as download:
                      gh('release', 'download', tag, '--repo', repo,
                         '--pattern', source.name, '--dir', download)
                      asset = Path(download) / source.name
                      if not asset.is_file() or asset.stat().st_size != expected_size or hashlib.sha256(asset.read_bytes()).hexdigest() != expected_hash:
                          raise SystemExit('The release asset differs from the prepared userscript; nothing was overwritten.')

              if release:
                  matches = [asset for asset in release['assets'] if asset['name'] == source.name]
                  if len(matches) > 1:
                      raise SystemExit('The release has ambiguous userscript assets.')
                  if matches:
                      verify_asset()

              if not tag_ref:
                  # Create only the missing tag. Never move or delete an
                  # existing tag, including on recovery after a partial run.
                  gh('api', f'repos/{repo}/git/refs', '--method', 'POST',
                     '-f', f'ref=refs/tags/{tag}', '-f', f'sha={release_commit}')
              if not release:
                  gh('release', 'create', tag, str(source), '--repo', repo,
                     '--verify-tag', '--target', release_commit, '--title', title,
                     '--notes-file', str(notes), '--draft', '--prerelease', '--latest=false')
                  release = release_for_tag()
                  if not release:
                      raise SystemExit('The draft release could not be found after creation.')
              elif not any(asset['name'] == source.name for asset in release['assets']):
                  # Recover a missing upload while preserving all other assets.
                  gh('release', 'upload', tag, str(source), '--repo', repo)
              verify_asset()

              if (release['draft'] or not release['prerelease'] or release['name'] != title
                      or latest_before and latest_before['id'] == release['id']):
                  release = api_write(
                      f'repos/{repo}/releases/{release["id"]}', 'PATCH', {
                          'tag_name': tag,
                          'name': title,
                          'body': notes.read_text(encoding='utf-8'),
                          'draft': False,
                          'prerelease': True,
                          'make_latest': 'false',
                      })

              release = release_for_tag()
              if not release:
                  raise SystemExit('The release disappeared during publication.')
              if release['tag_name'] != tag or release['draft'] or not release['prerelease'] or release['name'] != title:
                  raise SystemExit('The release was not published in the expected prerelease state.')
              actual_commit = tagged_commit(api(tag_path))
              if actual_commit != release_commit:
                  raise SystemExit('The release tag changed unexpectedly.')
              verify_source_at(actual_commit)
              verify_asset()
              latest = api(f'repos/{repo}/releases/latest', absent_ok=True)
              if latest is None or latest['tag_name'] == tag:
                  # Restore the prior stable release only if no other stable
                  # release has become Latest in the meantime.
                  api_write(f'repos/{repo}/releases/{stable["id"]}', 'PATCH',
                            {'make_latest': 'true'})
              if api(f'repos/{repo}/releases/latest')['id'] != stable['id']:
                  raise SystemExit('Latest changed during publication; the newer selection was preserved.')
              print(release['html_url'])
